name: Build Es Teh Kasir APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        run: |
          gradle assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx2g" \
            -Dkotlin.jvm.target.validation.mode=warning
        working-directory: EsTehKasir_V2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EsTehKasir-v2.0-debug-apk
          path: EsTehKasir_V2/app/build/outputs/apk/debug/app-debug.apk
